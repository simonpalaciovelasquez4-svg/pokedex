<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDexxx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container-fluid">
        <h1 class="text-center">PokeDexx</h1>
    </div>
    <div class="container mt-5">
        <p>Bienvenido a pokedexx aca puedes encontrar la informacion que desees</p>
    </div>
    <div class="container mt-5">
        <form>
  <div class="mb-3">
    <label  class="form-label">Ingresa el Pokemon a investigar</label>
    <input type="text" class="form-control" id="pokeUser" >
    <div  class="form-text">Asegurate de copiar bien su nombre.</div>
  </div>
  <button type="submit" class="btn btn-danger" id="buscar">BUSCAR</button>
</form> 
<section class="d-flex align-items-center gap-4 mt-5">
    <div class="container mt-0">
        <img src="img/pokeball_PNG29.png" 
             alt="Pokemon" 
             id="pokeImg" 
             class="img-fluid" 
             style="max-width: 200px;">
    </div>

    <div id="resultado" class="container mt-0 flex-grow-1"></div>
</section>

    <script src="app.js"></script>
</body>
</html>
